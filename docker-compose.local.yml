# Local-only bindings; use together with docker-compose.yml.
services:
  mysql:
    ports: !override
      - "127.0.0.1:13306:3306"

  im-server:
    image: bitcomputing/im-server:local
    build:
      labels:
        org.opencontainers.image.revision: ${IM_SERVER_REVISION:-unknown}
        org.opencontainers.image.source: https://github.com/bitcomputing/im-server
    ports: !override
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9002:9002"
      - "127.0.0.1:9003:9003"
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:6060:6060"
    volumes:
      - im-logs:/opt/logs
      - im-uploads:/opt/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9003/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  im-logs:
  im-uploads:
