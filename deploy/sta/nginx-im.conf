# The Alibaba Cloud ALB terminates public TLS and forwards HTTP to this origin.
server {
    listen 80;
    server_name im-sta.43chat.cn;

    location / {
        proxy_pass http://127.0.0.1:19001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 80;
    server_name wsim-sta.43chat.cn;

    # The Web SDK probes this endpoint before opening /im.
    location = /health {
        proxy_pass http://127.0.0.1:19003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /im {
        proxy_pass http://127.0.0.1:19003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
